<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Nested Shape Art Visualizer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Nested Shape Art Visualizer</h1>
      <p>Prototype generated from product spec</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="View mode">
      <button id="tab2dBtn" class="tab active" role="tab" aria-selected="true">2-D</button>
      <button id="tab3dBtn" class="tab" role="tab" aria-selected="false">3-D</button>
    </nav>

    <main>
      <section id="tab2d" class="panel active">
        <canvas id="curveCanvas" width="900" height="520"></canvas>

        <div class="controls">
          <label>Next curve size (% of original)
            <input id="initialScale" type="range" min="1" max="99" step="0.5" value="85" />
            <output id="initialScaleVal">85</output>
          </label>
          <label>Last curve size (% of previous)
            <input id="finalScale" type="range" min="1" max="99" step="0.5" value="92" />
            <output id="finalScaleVal">92</output>
          </label>
          <label>Minimum last curve size (% of original)
            <input id="minLast" type="range" min="0.5" max="50" step="0.5" value="3" />
            <output id="minLastVal">3</output>
          </label>
          <label>Scale transition
            <select id="interpolation">
              <option value="linear">linear</option>
              <option value="ease_in_out" selected>ease_in_out</option>
              <option value="cubic_spline">cubic_spline</option>
            </select>
          </label>
          <label>Gradient start color <input id="startColor" type="color" value="#782850" /></label>
          <label>Gradient end color <input id="endColor" type="color" value="#f0d2e6" /></label>
          <button id="undoBtn">Undo</button>
          <button id="redoBtn">Redo</button>
          <button id="exportBtn">Export SVG</button>
          <p id="status"></p>
        </div>
      </section>

      <section id="tab3d" class="panel">
        <canvas id="ribCanvas" width="900" height="520"></canvas>
        <div class="controls">
          <label>Material thickness (inches)
            <input id="thickness" type="range" min="0.01" max="1" step="0.01" value="0.11" />
            <output id="thicknessVal">0.11</output>
          </label>
          <label>Pivot along rib midline
            <input id="pivotT" type="range" min="0" max="1" step="0.01" value="0.5" />
            <output id="pivotTVal">0.5</output>
          </label>
          <label>Rib rotation in XY (degrees)
            <input id="rotation" type="range" min="-180" max="180" step="1" value="0" />
            <output id="rotationVal">0</output>
          </label>
          <label>Rib side color <input id="sideColor" type="color" value="#1e1e1e" /></label>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
